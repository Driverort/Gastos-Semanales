<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<title>Mis Gastos Semanales</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#18211f;--mu:#62706c;--ac:#0f766e;--ac2:#e0f2ef;--bd:#dde4e2;--rd:#c2410c;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--card:#17211f;--tx:#e8efed;--mu:#93a39e;--ac:#2dd4bf;--ac2:#12332f;--bd:#273532;--rd:#fb923c;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1514;--card:#17211f;--tx:#e8efed;--mu:#93a39e;--ac:#2dd4bf;--ac2:#12332f;--bd:#273532;--rd:#fb923c;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:var(--ac2);color:var(--ac)}
button.x{background:transparent;color:var(--rd);padding:6px 8px}
.wk{text-align:center;flex:1}.wk b{display:block;font-size:16px}.wk span{font-size:12px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--bg);border-radius:10px;padding:8px 10px}.k small{color:var(--mu);font-size:11px}.k div{font-weight:700;font-size:15px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}
.it input[type=checkbox]{width:22px;height:22px;flex:none}
.it .m{flex:1;min-width:0}.it .m b{display:block;overflow-wrap:anywhere}.it .m small{color:var(--mu)}
.it.d .m b{text-decoration:line-through;color:var(--mu)}
.am{text-align:right;font-weight:700;white-space:nowrap}.am small{display:block;color:var(--mu);font-weight:400}
.neg{color:var(--rd)}.pos{color:var(--ok)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.f{margin-bottom:10px}
.emp{text-align:center;color:var(--mu);padding:18px 0}
.hint{font-size:12px;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<h1>💸 Mis Gastos Semanales</h1>

<div class="card">
  <div class="row">
    <div style="flex:1"><label for="rate">Precio del dólar (Bs por 1 USD)</label>
    <input id="rate" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Ej: 45.50"></div>
    <button id="saveRate" style="align-self:flex-end">Actualizar</button>
  </div>
  <div class="hint" id="rateInfo"></div>
</div>

<div class="card row sp">
  <button class="g" id="prev" aria-label="Semana anterior">‹</button>
  <div class="wk"><b id="wkT"></b><span id="wkS"></span></div>
  <button class="g" id="next" aria-label="Semana siguiente">›</button>
</div>
<div class="row" style="margin:-4px 0 10px"><button class="g" id="today" style="flex:1">Ir a esta semana</button></div>

<div class="card">
  <div class="grid">
    <div class="k"><small>Total de la semana</small><div id="tot"></div></div>
    <div class="k"><small>Equivalente en USD</small><div id="totU"></div></div>
    <div class="k"><small>Pendiente por pagar</small><div id="pen" class="neg"></div></div>
    <div class="k"><small>Ya pagado</small><div id="pag" class="pos"></div></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div style="flex:1"><label for="inc">Mi ingreso de esta semana (Bs)</label>
    <input id="inc" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Salario o lo que recibes"></div>
    <div class="k" style="flex:1"><small>Me queda</small><div id="left"></div></div>
  </div>
</div>

<div class="card" id="list"></div>

<button class="fab" id="add">＋ Agregar</button>

<div class="sheet" id="sh">
  <div class="box">
    <div class="row sp"><b id="shT">Nuevo gasto</b><button class="x" id="cl">Cerrar</button></div>
    <div class="f"><label for="d">Descripción</label><input id="d" placeholder="Ej: Cuota del teléfono"></div>
    <div class="row f">
      <div style="flex:2"><label for="a">Monto</label><input id="a" type="number" inputmode="decimal" step="0.01" min="0"></div>
      <div style="flex:1"><label for="c">Moneda</label><select id="c"><option value="Bs">Bs</option><option value="USD">USD</option></select></div>
    </div>
    <div class="f"><label for="dt">Fecha en que debo pagar (define la semana)</label><input id="dt" type="date"></div>
    <button id="ok" style="width:100%">Guardar</button>
  </div>
</div>

<script>
(function(){
var K="gastosSemanales.v1",S={rate:0,items:[],inc:{}},view=new Date(),editId=null;
try{var raw=localStorage.getItem(K);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}}
function $(i){return document.getElementById(i)}
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function mon(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function fmt(n){return n.toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2})}
function bs(it){return it.cur==="USD"?it.amt*S.rate:it.amt}
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function short(d){return d.getDate()+" "+MES[d.getMonth()]}
function render(){
  var m0=mon(view),m1=new Date(m0);m1.setDate(m1.getDate()+6);var key=ymd(m0);
  var isNow=key===ymd(mon(new Date()));
  $("wkT").textContent=isNow?"Esta semana":"Semana del "+short(m0);
  $("wkS").textContent=short(m0)+" – "+short(m1)+" "+m1.getFullYear();
  $("rate").value=S.rate||"";
  $("rateInfo").textContent=S.rate?"1 USD = "+fmt(S.rate)+" Bs · los montos en USD se convierten con esta tasa.":"Escribe el precio del dólar para convertir tus deudas en USD.";
  var its=S.items.filter(function(i){return ymd(mon(parse(i.date)))===key}).sort(function(a,b){return a.date<b.date?-1:1});
  var t=0,p=0,g=0;its.forEach(function(i){var v=bs(i);t+=v;if(i.paid)g+=v;else p+=v});
  $("tot").textContent=fmt(t)+" Bs";$("totU").textContent=S.rate?"$ "+fmt(t/S.rate):"—";
  $("pen").textContent=fmt(p)+" Bs";$("pag").textContent=fmt(g)+" Bs";
  var inc=S.inc[key]||0;$("inc").value=inc||"";
  var l=inc-t;$("left").textContent=fmt(l)+" Bs";$("left").className=l<0?"neg":"pos";
  var h="";
  if(!its.length)h='<div class="emp">No hay gastos en esta semana.<br>Toca “＋ Agregar”.</div>';
  its.forEach(function(i){
    var dd=parse(i.date),dias=["dom","lun","mar","mié","jue","vie","sáb"];
    h+='<div class="it'+(i.paid?" d":"")+'"><input type="checkbox" data-p="'+i.id+'"'+(i.paid?" checked":"")+' aria-label="Pagado">'
      +'<div class="m" data-e="'+i.id+'"><b>'+esc(i.desc)+'</b><small>'+dias[dd.getDay()]+" "+short(dd)+'</small></div>'
      +'<div class="am">'+(i.cur==="USD"?"$ "+fmt(i.amt)+"<small>"+fmt(bs(i))+" Bs</small>":fmt(i.amt)+" Bs")+'</div>'
      +'<button class="x" data-x="'+i.id+'" aria-label="Eliminar">✕</button></div>';
  });
  $("list").innerHTML=h;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function open(it){
  editId=it?it.id:null;$("shT").textContent=it?"Editar gasto":"Nuevo gasto";
  $("d").value=it?it.desc:"";$("a").value=it?it.amt:"";$("c").value=it?it.cur:"Bs";
  $("dt").value=it?it.date:ymd(view.getTime()>=mon(new Date()).getTime()&&ymd(mon(view))===ymd(mon(new Date()))?new Date():mon(view));
  $("sh").classList.add("on");setTimeout(function(){$("d").focus()},50);
}
function close(){$("sh").classList.remove("on")}
$("add").onclick=function(){open(null)};$("cl").onclick=close;
$("sh").onclick=function(e){if(e.target===$("sh"))close()};
$("ok").onclick=function(){
  var d=$("d").value.trim(),a=parseFloat($("a").value),dt=$("dt").value;
  if(!d||!(a>0)||!dt){alert("Completa descripción, monto y fecha.");return}
  var c=$("c").value;
  if(c==="USD"&&!S.rate){alert("Primero escribe el precio del dólar arriba.");close();$("rate").focus();return}
  if(editId){S.items.forEach(function(i){if(i.id===editId){i.desc=d;i.amt=a;i.cur=c;i.date=dt}})}
  else S.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),desc:d,amt:a,cur:c,date:dt,paid:false});
  save();view=parse(dt);close();render();
};
$("list").onclick=function(e){
  var t=e.target;
  if(t.dataset.x){if(confirm("¿Eliminar este gasto?")){S.items=S.items.filter(function(i){return i.id!==t.dataset.x});save();render()}return}
  if(t.dataset.p){S.items.forEach(function(i){if(i.id===t.dataset.p)i.paid=t.checked});save();render();return}
  var m=t.closest("[data-e]");if(m){var id=m.dataset.e;open(S.items.filter(function(i){return i.id===id})[0])}
};
$("saveRate").onclick=function(){var r=parseFloat($("rate").value);if(!(r>0)){alert("Escribe un precio válido.");return}S.rate=r;save();render()};
$("inc").onchange=function(){S.inc[ymd(mon(view))]=parseFloat($("inc").value)||0;save();render()};
$("prev").onclick=function(){view=new Date(view.getFullYear(),view.getMonth(),view.getDate()-7);render()};
$("next").onclick=function(){view=new Date(view.getFullYear(),view.getMonth(),view.getDate()+7);render()};
$("today").onclick=function(){view=new Date();render()};
render();

})();
</script>
</body>
</html>
